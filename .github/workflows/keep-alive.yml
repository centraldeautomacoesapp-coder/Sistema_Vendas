name: Keep Streamlit Alive

on:
  schedule:
    # Executa a cada 4 horas (você pode ajustar o cron conforme preferir)
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP request to Streamlit app
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" https://sistemavendas-3.streamlit.app/
